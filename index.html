<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christ the Way — Daily Reading Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15141f;
    --bg-soft: #1c1b29;
    --card: #201f2e;
    --card-border: rgba(255,255,255,0.08);
    --text: #f1ede4;
    --text-dim: #a6a1b8;
    --text-faint: #726e88;
    --gold: #dcae55;
    --gold-soft: rgba(220,174,85,0.14);
    --done-bg: rgba(220,174,85,0.10);
    --track: rgba(255,255,255,0.08);
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --radius: 18px;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  :root:not([data-theme="light"]){
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg: #f4f0e6;
      --bg-soft: #ece5d3;
      --card: #fffdf8;
      --card-border: rgba(30,25,15,0.10);
      --text: #221f2c;
      --text-dim: #5c5670;
      --text-faint: #8a8398;
      --gold: #b1811f;
      --gold-soft: rgba(177,129,31,0.12);
      --done-bg: rgba(177,129,31,0.08);
      --track: rgba(30,25,15,0.08);
      --shadow: 0 10px 26px rgba(60,45,10,0.10);
      color-scheme: light;
    }
  }
  :root[data-theme="light"]{
    --bg: #f4f0e6;
    --bg-soft: #ece5d3;
    --card: #fffdf8;
    --card-border: rgba(30,25,15,0.10);
    --text: #221f2c;
    --text-dim: #5c5670;
    --text-faint: #8a8398;
    --gold: #b1811f;
    --gold-soft: rgba(177,129,31,0.12);
    --done-bg: rgba(177,129,31,0.08);
    --track: rgba(30,25,15,0.08);
    --shadow: 0 10px 26px rgba(60,45,10,0.10);
    color-scheme: light;
  }

  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  html{
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  body{
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
    min-height: 100%;
    background-image:
      radial-gradient(60% 45% at 12% -6%, var(--gold-soft), transparent 60%),
      radial-gradient(50% 40% at 100% 0%, rgba(220,174,85,0.06), transparent 55%);
    background-attachment: fixed;
  }

  .wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 34px 20px 10px;
  }

  /* ---------- Hero ---------- */
  .hero{
    padding: 6px 2px 26px;
  }
  .hero .kicker{
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--gold);
    letter-spacing: 0.01em;
    margin: 0 0 6px;
  }
  .hero h1{
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(32px, 8vw, 44px);
    line-height: 1.05;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .hero p.sub{
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.55;
    margin: 0 0 22px;
    max-width: 46ch;
  }

  .progress-card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow);
  }
  .progress-top{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .progress-top .label{
    font-size: 12.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .progress-top .count{
    font-family: var(--serif);
    font-size: 26px;
    color: var(--text);
  }
  .progress-top .count b{
    color: var(--gold);
    font-weight: 600;
  }
  .bar-track{
    height: 8px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill{
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--gold), #f0cd82);
    width: 0%;
    transition: width 0.5s ease;
  }
  .progress-foot{
    display:flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-faint);
  }

  /* ---------- Today card ---------- */
  .today{
    margin-top: 22px;
    border-radius: var(--radius);
    padding: 22px;
    background: linear-gradient(160deg, var(--gold-soft), transparent 65%), var(--card);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .today::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width: 4px;
    background: var(--gold);
  }
  .today .eyebrow{
    font-size: 12.5px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 8px;
    font-weight: 600;
  }
  .today .date{
    font-family: var(--serif);
    font-size: 21px;
    margin: 0 0 4px;
  }
  .today .reading{
    color: var(--text-dim);
    font-size: 15.5px;
    line-height: 1.5;
    margin: 0 0 16px;
  }
  .today label.check{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 14.5px;
    color: var(--text);
    user-select: none;
  }
  .today input[type="checkbox"]{
    width: 20px; height: 20px;
    accent-color: var(--gold);
    cursor: pointer;
  }
  .outside-range{
    font-size: 13.5px;
    color: var(--text-faint);
    margin-top: 4px;
  }
  .today .note-field{
    margin-top: 16px;
  }
  .today .note-field label{
    display:block;
    font-size: 12.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .today textarea{
    width: 100%;
    min-height: 64px;
    resize: vertical;
    background: var(--bg-soft);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  .today textarea:focus, .day-item textarea:focus{
    outline: 1.5px solid var(--gold);
    outline-offset: 1px;
  }

  /* ---------- Note toggle + box (in day list) ---------- */
  .note-btn{
    flex: none;
    width: 26px; height: 26px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
  }
  .note-btn:hover{
    background: var(--track);
    color: var(--text-dim);
  }
  .note-btn svg{ width: 16px; height: 16px; }
  .note-btn .dot{
    position: absolute;
    top: 4px; right: 4px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent, var(--gold));
    display: none;
  }
  .note-btn.has-note .dot{ display: block; }
  .note-btn.active{
    background: var(--track);
    color: var(--gold);
  }

  .note-box{
    padding: 2px 10px 10px 62px;
  }
  .note-box textarea{
    width: 100%;
    min-height: 54px;
    resize: vertical;
    background: var(--bg-soft);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 9px 11px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.5;
  }
  .note-box textarea::placeholder{
    color: var(--text-faint);
  }

  /* ---------- Month list ---------- */
  .months{
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  details.month{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  details.month[open]{
    box-shadow: var(--shadow);
  }
  summary.month-head{
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    position: relative;
  }
  summary.month-head::-webkit-details-marker{ display:none; }
  summary.month-head::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width: 5px;
    background: var(--accent);
  }
  .swatch{
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }
  .month-title{
    font-family: var(--serif);
    font-size: 18px;
    flex: 1;
    min-width: 0;
  }
  .month-title small{
    display:block;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--text-faint);
    font-weight: 500;
    margin-top: 1px;
  }
  .month-frac{
    font-size: 13px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  .chev{
    width: 18px; height: 18px;
    flex: none;
    color: var(--text-faint);
    transition: transform 0.25s ease;
  }
  details.month[open] .chev{ transform: rotate(180deg); }

  .mini-track{
    height: 4px;
    background: var(--track);
    margin: 0 18px;
  }
  .mini-fill{
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.35s ease;
  }

  .day-list{
    padding: 6px 8px 14px;
  }
  .day-item{
    border-radius: 10px;
    overflow: hidden;
  }
  .day-row{
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 10px;
    border-radius: 10px;
  }
  .day-row.done{
    background: var(--done-bg);
  }
  .day-row.today-row{
    outline: 1.5px solid var(--gold);
    outline-offset: -1.5px;
  }
  .day-row input[type="checkbox"]{
    margin-top: 2px;
    width: 18px; height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex: none;
  }
  .day-num{
    font-variant-numeric: tabular-nums;
    color: var(--text-faint);
    font-size: 13px;
    width: 22px;
    flex: none;
    padding-top: 1px;
    text-align: right;
  }
  .day-text{
    flex: 1;
    font-size: 14.5px;
    line-height: 1.45;
    color: var(--text);
    cursor: pointer;
  }
  .day-row.done .day-text{
    color: var(--text-faint);
    text-decoration: line-through;
    text-decoration-color: var(--text-faint);
    text-decoration-thickness: 1px;
  }

  footer{
    max-width: 760px;
    margin: 30px auto 0;
    padding: 0 20px 10px;
    color: var(--text-faint);
    font-size: 12.5px;
    text-align: center;
    line-height: 1.6;
  }
  footer button{
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    cursor: pointer;
    margin-top: 10px;
  }
  footer button:hover{
    border-color: var(--gold);
    color: var(--gold);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <p class="kicker">Encounter Series I</p>
    <h1>Christ the Way</h1>
    <p class="sub">A year-long walk through the life of Jesus, one reading a day, from <span id="rangeStart"></span> to <span id="rangeEnd"></span>.</p>
    <div class="progress-card">
      <div class="progress-top">
        <div>
          <div class="label">Your progress</div>
          <div class="count"><b id="doneCount">0</b> of 365 read</div>
        </div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="overallBar"></div></div>
      <div class="progress-foot">
        <span id="overallPct">0%</span>
        <span id="overallDayLabel"></span>
      </div>
    </div>
  </div>

  <div class="today" id="todayCard">
    <p class="eyebrow" id="todayEyebrow">Today's reading</p>
    <p class="date" id="todayDate"></p>
    <p class="reading" id="todayReading"></p>
    <label class="check">
      <input type="checkbox" id="todayCheck">
      <span id="todayCheckLabel">Mark today's reading complete</span>
    </label>
    <div class="note-field" id="todayNoteField">
      <label for="todayNote">What did you learn?</label>
      <textarea id="todayNote" placeholder="Jot down a thought, a verse that stood out, a prayer..."></textarea>
    </div>
  </div>

  <div class="months" id="months"></div>

  <footer>
    Checkmarks and notes are saved on this device only.
    <br>
    <button id="resetBtn" type="button">Reset all checkmarks</button>
  </footer>
</div>

const START_DATE = "2026-09-21";
const STORE_KEY = "encounter-christ-the-way-progress";
const NOTES_KEY = "encounter-christ-the-way-notes";

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const ACCENTS = {
  1: "#8f7fc7",  // January - violet
  2: "#5b8aa6",  // February - slate blue
  3: "#79a06a",  // March - sage
  4: "#c9789f",  // April - dusty rose
  5: "#c2a13a",  // May - mustard gold
  6: "#4a9e97",  // June - teal
  7: "#cf6f52",  // July - terracotta red
  8: "#cf9a45",  // August - amber
  9: "#d9843d",  // September - orange
  10: "#b0632f", // October - rust
  11: "#9c8c4f", // November - olive gold
  12: "#4c6f9c"  // December - deep blue
};

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){}
}
let progress = loadProgress();

function loadNotes(){
  try{
    const raw = localStorage.getItem(NOTES_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveNotes(n){
  try{ localStorage.setItem(NOTES_KEY, JSON.stringify(n)); }catch(e){}
}
let notes = loadNotes();
let noteSaveTimer = null;
function queueSaveNotes(){
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(() => saveNotes(notes), 350);
}

function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
}
function fmtDateShort(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { month:"long", day:"numeric", year:"numeric" });
}

function todayIso(){
  const now = new Date();
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,"0"), d = String(now.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function groupByMonth(entries){
  const groups = [];
  let cur = null;
  for(const e of entries){
    const key = e.year + "-" + e.month;
    if(!cur || cur.key !== key){
      cur = { key, year:e.year, month:e.month, items:[] };
      groups.push(cur);
    }
    cur.items.push(e);
  }
  return groups;
}

function render(){
  document.getElementById("rangeStart").textContent = fmtDateShort(READINGS[0].date);
  document.getElementById("rangeEnd").textContent = fmtDateShort(READINGS[READINGS.length-1].date);

  const tIso = todayIso();
  let todayEntry = READINGS.find(e => e.date === tIso);
  let beforeStart = tIso < START_DATE;
  let afterEnd = !todayEntry && !beforeStart;

  const todayCard = document.getElementById("todayCard");
  if(todayEntry){
    document.getElementById("todayEyebrow").textContent = "Today's reading";
    document.getElementById("todayDate").textContent = fmtDate(todayEntry.date);
    document.getElementById("todayReading").textContent = todayEntry.reading;
    const cb = document.getElementById("todayCheck");
    cb.checked = !!progress[todayEntry.date];
    document.getElementById("todayCheckLabel").textContent = cb.checked ? "Reading complete" : "Mark today's reading complete";
    cb.onchange = () => {
      if(cb.checked) progress[todayEntry.date] = true; else delete progress[todayEntry.date];
      saveProgress(progress);
      document.getElementById("todayCheckLabel").textContent = cb.checked ? "Reading complete" : "Mark today's reading complete";
      updateRow(todayEntry.date);
      updateCounts();
    };

    const noteEl = document.getElementById("todayNote");
    noteEl.value = notes[todayEntry.date] || "";
    noteEl.oninput = () => {
      const v = noteEl.value;
      if(v.trim()) notes[todayEntry.date] = v; else delete notes[todayEntry.date];
      queueSaveNotes();
      updateRowNoteIndicator(todayEntry.date);
      const rowNoteEl = document.querySelector(`.note-box[data-date="${todayEntry.date}"] textarea`);
      if(rowNoteEl && rowNoteEl !== noteEl) rowNoteEl.value = v;
    };
  } else {
    document.getElementById("todayEyebrow").textContent = beforeStart ? "Plan begins soon" : "Plan complete";
    document.getElementById("todayDate").textContent = beforeStart
      ? fmtDate(START_DATE)
      : "You've reached the end of the year";
    document.getElementById("todayReading").textContent = beforeStart
      ? READINGS[0].reading
      : "Well done finishing Christ the Way. You can still browse or check off any reading below.";
    todayCard.querySelector("label.check").style.display = "none";
    document.getElementById("todayNoteField").style.display = "none";
  }

  const monthsEl = document.getElementById("months");
  monthsEl.innerHTML = "";
  const groups = groupByMonth(READINGS);

  for(const g of groups){
    const accent = ACCENTS[g.month];
    const det = document.createElement("details");
    det.className = "month";
    det.style.setProperty("--accent", accent);
    const isCurrentMonth = todayEntry && todayEntry.year === g.year && todayEntry.month === g.month;
    if(isCurrentMonth || (beforeStart && g === groups[0])) det.open = true;

    const summary = document.createElement("summary");
    summary.className = "month-head";
    summary.innerHTML = `
      <span class="swatch"></span>
      <span class="month-title">${MONTH_NAMES[g.month-1]}<small>${g.year} · ${g.items.length} days</small></span>
      <span class="month-frac" data-frac="${g.key}">0/${g.items.length}</span>
      <svg class="chev" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    `;
    det.appendChild(summary);

    const track = document.createElement("div");
    track.className = "mini-track";
    track.innerHTML = `<div class="mini-fill" data-fill="${g.key}"></div>`;
    det.appendChild(track);

    const list = document.createElement("div");
    list.className = "day-list";
    for(const e of g.items){
      const item = document.createElement("div");
      item.className = "day-item";
      item.dataset.date = e.date;

      const row = document.createElement("div");
      row.className = "day-row";
      row.dataset.date = e.date;
      if(e.date === tIso) row.classList.add("today-row");
      if(progress[e.date]) row.classList.add("done");

      const cbId = "chk-" + e.date;
      row.innerHTML = `
        <input type="checkbox" id="${cbId}" ${progress[e.date] ? "checked" : ""}>
        <span class="day-num">${e.day}</span>
        <label class="day-text" for="${cbId}">${e.reading}</label>
        <button type="button" class="note-btn${notes[e.date] ? " has-note" : ""}" aria-label="Add a note for this day" aria-expanded="false">
          <svg viewBox="0 0 20 20" fill="none"><path d="M4 4.5h12M4 9.5h12M4 14.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="dot"></span>
        </button>
      `;

      const noteBox = document.createElement("div");
      noteBox.className = "note-box";
      noteBox.dataset.date = e.date;
      noteBox.hidden = true;
      noteBox.innerHTML = `<textarea placeholder="What did you learn?">${notes[e.date] ? notes[e.date].replace(/</g,"&lt;") : ""}</textarea>`;

      const cb = row.querySelector("input");
      cb.addEventListener("change", () => {
        if(cb.checked) progress[e.date] = true; else delete progress[e.date];
        saveProgress(progress);
        row.classList.toggle("done", cb.checked);
        if(e.date === tIso){
          const tcb = document.getElementById("todayCheck");
          if(tcb){ tcb.checked = cb.checked; document.getElementById("todayCheckLabel").textContent = cb.checked ? "Reading complete" : "Mark today's reading complete"; }
        }
        updateMonthFrac(g.key, g.items);
        updateCounts();
      });

      const noteBtn = row.querySelector(".note-btn");
      noteBtn.addEventListener("click", () => {
        const open = noteBox.hidden;
        noteBox.hidden = !open;
        noteBtn.classList.toggle("active", open);
        noteBtn.setAttribute("aria-expanded", String(open));
        if(open) noteBox.querySelector("textarea").focus();
      });

      const ta = noteBox.querySelector("textarea");
      ta.addEventListener("input", () => {
        const v = ta.value;
        if(v.trim()) notes[e.date] = v; else delete notes[e.date];
        queueSaveNotes();
        noteBtn.classList.toggle("has-note", !!v.trim());
        if(e.date === tIso){
          const tNote = document.getElementById("todayNote");
          if(tNote && tNote !== ta) tNote.value = v;
        }
      });

      item.appendChild(row);
      item.appendChild(noteBox);
      list.appendChild(item);
    }
    det.appendChild(list);
    monthsEl.appendChild(det);
    updateMonthFrac(g.key, g.items);
  }

  updateCounts();
}

function updateRow(date){
  const row = document.querySelector(`.day-row[data-date="${date}"]`);
  if(row){
    row.classList.toggle("done", !!progress[date]);
    row.querySelector("input").checked = !!progress[date];
  }
}

function updateRowNoteIndicator(date){
  const item = document.querySelector(`.day-item[data-date="${date}"]`);
  if(item){
    const btn = item.querySelector(".note-btn");
    if(btn) btn.classList.toggle("has-note", !!(notes[date] && notes[date].trim()));
  }
}

function updateMonthFrac(key, items){
  const done = items.filter(e => progress[e.date]).length;
  const fracEl = document.querySelector(`[data-frac="${key}"]`);
  const fillEl = document.querySelector(`[data-fill="${key}"]`);
  if(fracEl) fracEl.textContent = `${done}/${items.length}`;
  if(fillEl) fillEl.style.width = (done/items.length*100) + "%";
}

function updateCounts(){
  const done = READINGS.filter(e => progress[e.date]).length;
  document.getElementById("doneCount").textContent = done;
  const pct = Math.round(done/READINGS.length*100);
  document.getElementById("overallBar").style.width = pct + "%";
  document.getElementById("overallPct").textContent = pct + "%";

  const tIso = todayIso();
  let idx = READINGS.findIndex(e => e.date === tIso);
  let label = "";
  if(idx >= 0){
    label = `Day ${idx+1} of ${READINGS.length}`;
  } else if(tIso < START_DATE){
    label = "Starts " + fmtDateShort(START_DATE);
  } else {
    label = "Year complete";
  }
  document.getElementById("overallDayLabel").textContent = label;
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if(confirm("Clear all checked readings on this device?")){
    progress = {};
    saveProgress(progress);
    render();
  }
});

render();
</script>
</body>
</html>
